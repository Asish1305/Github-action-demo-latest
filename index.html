    <style>
        /* ==========================================================
           1. CORE DESIGN VARIABLES & GLOBAL SYSTEM RESETS
           ========================================================== */
        :root {
            --bg: #070b14;
            --card: rgba(255, 255, 255, .05);
            --border: rgba(255, 255, 255, .09);
            --text: #ffffff;
            --text2: #cbd5e1;
            --green: #00F5A0;
            --blue: #38BDF8;
            --purple: #7C3AED;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Fixed data-theme mapping configuration */
        body[data-theme="light"] {
            --bg: #f8fafc;
            --card: rgba(15, 23, 42, 0.04);
            --border: rgba(15, 23, 42, 0.08);
            --text: #0f172a;
            --text2: #475569;
            --purple: #4f46e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
        }

        #particles-js {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -4;
            pointer-events: none;
        }

        #mouse-glow-element {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 245, 160, 0.07) 0%, rgba(124, 58, 237, 0.03) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transform: translate(-50%, -50%);
            will-change: left, top;
        }

        /* ==========================================================
           2. AMBIENT BACKGROUND SYSTEM DYNAMICS
           ========================================================== */
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: -3;
            opacity: .14;
            will-change: transform;
        }

        body::before {
            width: 700px;
            height: 700px;
            background: var(--green);
            filter: blur(170px);
            top: -250px;
            left: -200px;
            animation: move1 12s infinite alternate ease-in-out;
        }

        body::after {
            width: 650px;
            height: 650px;
            background: var(--purple);
            filter: blur(180px);
            right: -150px;
            bottom: -200px;
            animation: move2 14s infinite alternate ease-in-out;
        }

        @keyframes move1 { 100% { transform: translate(120px, 150px); } }
        @keyframes move2 { 100% { transform: translate(-100px,-120px); } }

        @keyframes floatK8s { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
        @keyframes floatDocker { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-18px) rotate(-3deg); } }
        @keyframes floatAWS { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }

        /* ==========================================================
           3. STICKY GLASSMORPHISM NAVBAR LAYOUT
           ========================================================== */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(7, 11, 20, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 60px;
            z-index: 1000;
            transition: var(--transition);
        }

        header.scrolled {
            background: rgba(7, 11, 20, 0.85);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 12px 40px;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            font-family: "Space Grotesk", sans-serif;
            text-decoration: none;
            color: var(--text);
        }
        .logo span { color: var(--green); }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav { display: flex; gap: 35px; align-items: center; }
        nav a {
            text-decoration: none;
            color: var(--text2);
            font-size: 15px;
            transition: var(--transition);
            font-weight: 500;
            position: relative;
        }
        nav a:hover, nav a.active { color: var(--green); }
        nav a::after {
            content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--green); transition: var(--transition);
        }
        nav a.active::after, nav a:hover::after { width: 100%; }

        .controls-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .theme-toggle-btn {
            background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; transition: var(--transition);
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
            background: var(--card); border: 1px solid var(--border);
        }
        .theme-toggle-btn:hover { color: var(--blue); transform: scale(1.05); }

        .resume-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, var(--green), var(--blue));
            border-radius: 40px;
            text-decoration: none;
            color: #000;
            font-weight: 700;
            transition: var(--transition);
        }
        .resume-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 245, 160, 0.4);
        }

        .menu-btn {
            display: none; color: var(--text); font-size: 20px; cursor: pointer;
            background: none; border: none; width: 42px; height: 42px; align-items: center; justify-content: center;
            border-radius: 50%; background: var(--card); border: 1px solid var(--border); transition: var(--transition);
        }

        /* ==========================================
           4. SYSTEM TRANSITION HERO INTERFACE & PIPELINE ANIMATION
           ========================================== */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
